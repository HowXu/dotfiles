palette = "maple_dark" # maple_dark / maple_light

format = """
[\u250c](text bold)\
[\u2591\u2592\u2593](shell_bg)\
[ \ue62a  $shell](bg:shell_bg fg:base)\
[\ue0b4](bg:host_bg fg:shell_bg)\
[ \uf2c0 ](fg:base bg:host_bg)\
$hostname\
$username\
[\ue0b4](bg:env_bg fg:host_bg)\
$conda\
[\ue0b4](fg:env_bg bg:git_bg)\
$git_branch\
$git_status\
[\ue0b4](fg:git_bg bg:bridge_bg)\
[\ue0b4](fg:bridge_bg bg:clock_bg)\
$time\
[\ue0b4](fg:clock_bg)\
\n[\u2514](text bold)\
[ \ueb06 at](text bold)\
$directory
$character"""

add_newline = false

[palettes.maple_dark]
text = "#cbd5e1"
base = "#1e1e1f"
shell_bg = "#d2ccff"
host_bg = "#a1e8e5"
env_bg = "#8fc7ff"
git_bg = "#2d3a4b"
bridge_bg = "#475569"
clock_bg = "#171718"
success = "#a4dfae"
failure = "#edabab"

[palettes.maple_light]
text = "#475569"
base = "#fffffe"
shell_bg = "#726293"
host_bg = "#127d52"
env_bg = "#057d9e"
git_bg = "#e9efe3"
bridge_bg = "#dee4d8"
clock_bg = "#fafaf9"
success = "#547000"
failure = "#bd5151"

[hostname]
format = '[$ssh_symbol$hostname@]($style)'
ssh_only = false
style = 'fg:base bg:host_bg'

[username]
format = '[$user]($style)'
show_always = true
style_user = "fg:base bg:host_bg"
style_root = "fg:base bold underline bg:host_bg"

[directory]
style = "fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "\uf0219  "
"Downloads" = "\uf019 "
"Music" = "\uf001 "
"Pictures" = "\uf03e "

[git_branch]
symbol = "\uf418"
style = "bg:git_bg"
format = '[[ $symbol $branch ](fg:env_bg bg:git_bg)]($style)'

[git_status]
style = "bg:git_bg"
format = '[[($all_status$ahead_behind )](fg:env_bg bg:git_bg)]($style)'

[conda]
symbol = "\ue7a8"
format = '[ PyEnv $environment]($style)'
style = 'bg:env_bg fg:base bold'
ignore_base = false

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:clock_bg"
format = '[[$time](fg:text bg:clock_bg)]($style)'

[character]
success_symbol = '[❯](bold success)'
error_symbol = '[❯](bold failure)'

[shell]
disabled = false
bash_indicator = "Bash"
fish_indicator = "Fish"
zsh_indicator = "Zsh"
nu_indicator = "NuShell"
pwsh_indicator = "Pwsh"
style = 'bg:shell_bg fg:base'